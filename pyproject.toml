[project]
name = "scanner"
version = "1.0.0"
description = "Code scanner that writes a code-graph schema 1.0.0 document. The current command exports FastAPI routes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
export-fastapi = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scanner = ["export_overlay.sc"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
